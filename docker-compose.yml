version: "3.8"
services:
  mysql:
    image: mysql:8.0
    container_name: facttrace-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-facttrace}
    ports:
      - "3306:3306"
    volumes:
      - facttrace_mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed_mock.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
volumes:
  facttrace_mysql_data: