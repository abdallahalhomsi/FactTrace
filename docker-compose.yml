# USAGE:
#   docker compose up -d
#   Default password is facttrace123 if MYSQL_PASSWORD is not set in .env.
#   To use a custom password: docker compose --env-file backend/.env up -d

version: "3.8"
services:
  mysql:
    image: mysql:8.0
    container_name: facttrace-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-facttrace123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-facttrace}
    ports:
      - "3306:3306"
    volumes:
      - facttrace_mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed_mock.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
volumes:
  facttrace_mysql_data: